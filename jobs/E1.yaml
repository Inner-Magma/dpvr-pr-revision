# E1: end-to-end generation latency (R1.9, R2.3). Needs C2 (KV-cache decoding)
# merged. For every model: TTFT, decode ms/token, total for 64 and 256 new tokens,
# with the KV cache (the new path) and without it (the manuscript's Table 7 path).
#   python scripts/revision/run_queue.py jobs/E1.yaml --gpus 0
experiment: E1
defaults:
  gpus: 1
  min_free_gb: 70
jobs:
  - name: gen7b_vanilla_cache_{c}
    matrix: {c: ["true", "false"]}
    cmd: >
      python scripts/revision/bench_generate.py --vanilla --base_model llava-1.5-7b-hf
      --use_cache {c} --new_tokens 64,256 --out {out}/generate.json

  - name: gen7b_lf_s18_cache_{c}
    matrix: {c: ["true", "false"]}
    cmd: >
      python scripts/revision/bench_generate.py
      --config configs/method/token_diversion_x3_fusion.yaml
      --use_cache {c} --new_tokens 64,256 --out {out}/generate.json

  - name: gen13b_vanilla_cache_{c}
    matrix: {c: ["true", "false"]}
    cmd: >
      python scripts/revision/bench_generate.py --vanilla --base_model llava-1.5-13b-hf
      --use_cache {c} --new_tokens 64,256 --out {out}/generate.json

  - name: gen13b_lf_s{s}_cache_{c}
    matrix: {s: [24, 28], c: ["true", "false"]}
    cmd: >
      python scripts/revision/bench_generate.py
      --config configs/method/token_diversion_x3_fusion_13b_split{s}_d1.yaml
      --use_cache {c} --new_tokens 64,256 --out {out}/generate.json
