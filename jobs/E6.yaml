# E6: second backbone (C8; R1.14, R2.2). DPVR-LF on Qwen2.5-VL-7B-Instruct,
# trained like the 7B LLaVA run, plus the vanilla model through the same
# lmms-eval handler (qwen2_5_vl, use_cache=False).
#   python scripts/revision/run_queue.py jobs/E6.yaml --gpus 0-7
#   python scripts/revision/run_queue.py jobs/E6.yaml --gpus 0-7 --set split=14
# Needs ${MODEL_ROOT}/Qwen2.5-VL-7B-Instruct (HF format). Pick split from E2
# (results/revision/E2/qwen25vl_7b) or jobs/E6_split.yaml before the full run.
# Effective batch 4 as in the paper: 4 GPUs x 1 sample (torchrun DDP).
experiment: E6
vars:
  split: 16
  base: Qwen2.5-VL-7B-Instruct
  cfg: configs/method/token_diversion_x3_fusion_qwen25vl.yaml
defaults:
  gpus: 1
  min_free_gb: 40
jobs:
  - name: vanilla_eval
    cmd: >
      python scripts/revision/eval_lmms.py --checkpoint none --base_model {base}
      --tasks eight --out {out}

  # A few steps on a tiny subset, then a 20-sample eval: catches data, memory
  # and checkpoint-format problems before the long run.
  - name: smoke_train
    cmd: >
      python scripts/train.py --config {cfg} method.split_layer={split}
      data.subset_fraction=0.001 training.max_steps=20 training.save_strategy=no
      training.output_subdir=revision/E6/smoke_s{split}

  - name: smoke_eval
    after: [smoke_train]
    cmd: >
      python scripts/revision/eval_lmms.py
      --checkpoint ${CKPT_ROOT}/revision/E6/smoke_s{split} --base_model {base}
      --tasks pope,scienceqa --limit 20 --out {out}

  - name: train
    after: [smoke_eval]
    gpus: 4
    min_free_gb: 60
    cmd: >
      torchrun --standalone --nproc_per_node 4 scripts/train.py --config {cfg}
      method.split_layer={split} training.output_subdir=revision/E6/qwen25vl_lf_s{split}

  - name: eval
    after: [train]
    cmd: >
      python scripts/revision/eval_lmms.py
      --checkpoint ${CKPT_ROOT}/revision/E6/qwen25vl_lf_s{split} --base_model {base}
      --tasks eight --out {out}
