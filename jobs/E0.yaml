# E0: acceptance checks on the new server (SERVER_HANDOFF §1.4–1.5).
#   python scripts/revision/run_queue.py jobs/E0.yaml --gpus 0-7 \
#       --set prov_ckpt=<a 7B checkpoint trained with this code, see below>
# The 7B DPVR-LF seed=1 checkpoint of the paper is lost (its server is gone), so
# the old-checkpoint re-evaluation is dropped: the eval chain is checked with
# vanilla, and E9 seed=1 is compared with the old seed=1 scores instead.
# prov_ckpt only settles the training start (frozen weights): any 7B LLaVA-1.5
# checkpoint from the same codebase works, e.g. token_diversion/llava665k_split18_d1
# (DPVR-TD, 43 GB). It must hold the weights and training_config.json (if it only
# has checkpoint-N/ subdirs, point at the last one). Without one, provenance_7b refuses
# to start and the other jobs still run.
experiment: E0
vars:
  prov_ckpt: REQUIRED
defaults:
  gpus: 1
  min_free_gb: 30
jobs:
  - name: provenance_7b
    gpus: 0
    cmd: >
      python scripts/revision/check_weight_provenance.py
      --checkpoint {prov_ckpt} --out {out}/provenance.json
      --vicuna ${MODEL_ROOT}/reference/vicuna-7b-v1.5
      --projector ${MODEL_ROOT}/reference/llava-v1.5-7b-pretrain/mm_projector.bin

  # Benchmark sample counts against the paper's (SERVER_HANDOFF §1.3). Fails on a
  # mismatch; nothing depends on it, but a mismatch must go into RESULTS.md.
  - name: assets_verify
    gpus: 0
    cmd: >
      python scripts/revision/download_assets.py --verify --out {out}/assets.json

  # Eval-chain check: compare with the paper's vanilla LLaVA-1.5-7B row.
  - name: reeval_vanilla7b
    cmd: >
      python scripts/revision/eval_lmms.py --checkpoint none
      --tasks eight --out {out}

  # Latency wants an idle card: ask for nearly all of its memory.
  - name: latency_vanilla7b
    min_free_gb: 70
    cmd: >
      python scripts/revision/bench_latency.py --vanilla --base_model llava-1.5-7b-hf
      --batch 1 --n_txt 128 --out {out}/latency.json

  - name: latency_lf7b
    min_free_gb: 70
    after: [latency_vanilla7b]
    cmd: >
      python scripts/revision/bench_latency.py
      --config configs/method/token_diversion_x3_fusion.yaml
      --batch 1 --n_txt 128 --out {out}/latency.json

  # 50-step training smoke test: loss should fall, memory close to the paper's run.
  - name: smoke_train_lf7b
    min_free_gb: 60
    cmd: >
      python scripts/train.py --config configs/method/token_diversion_x3_fusion.yaml
      seed=1 training.max_steps=50 training.save_strategy=no
      training.output_subdir=revision/E0/smoke_train_lf7b
