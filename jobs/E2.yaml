# E2: training-free saturation analysis across model families (C6; R1.2, R2.7).
# Same 500 LLaVA-665k samples (seed 0) for every model; per-layer adjacent
# cosine, residual update, text->image attention mass and logit-lens KL.
#   python scripts/revision/run_queue.py jobs/E2.yaml --gpus 0-7
# Models other than LLaVA-1.5 must be downloaded to ${MODEL_ROOT}/<dir> first
# (HF-format checkpoints that AutoModelForImageTextToText loads in transformers
# 4.57.1). Swap or drop entries once the second backbone is decided; run a
# subset with --only.
experiment: E2
vars:
  n: 500
defaults:
  gpus: 1
  min_free_gb: 40
jobs:
  - name: llava15_7b
    cmd: >
      python scripts/revision/saturation.py --model llava-1.5-7b-hf
      --n_samples {n} --split 18 --out {out}

  - name: llava15_13b
    cmd: >
      python scripts/revision/saturation.py --model llava-1.5-13b-hf
      --n_samples {n} --split 28 --out {out}

  - name: llava16_mistral_7b
    cmd: >
      python scripts/revision/saturation.py --model llava-v1.6-mistral-7b-hf
      --n_samples {n} --out {out}

  - name: qwen25vl_7b
    cmd: >
      python scripts/revision/saturation.py --model Qwen2.5-VL-7B-Instruct
      --n_samples {n} --out {out}

  - name: internvl3_8b
    cmd: >
      python scripts/revision/saturation.py --model InternVL3-8B-hf
      --n_samples {n} --out {out}

  - name: compare
    gpus: 0
    after: [llava15_7b, llava15_13b, llava16_mistral_7b, qwen25vl_7b, internvl3_8b]
    cmd: >
      python scripts/revision/compare_saturation.py
      "LLaVA-1.5-7B={out}/../llava15_7b" "LLaVA-1.5-13B={out}/../llava15_13b"
      "LLaVA-1.6-Mistral-7B={out}/../llava16_mistral_7b"
      "Qwen2.5-VL-7B={out}/../qwen25vl_7b" "InternVL3-8B={out}/../internvl3_8b"
      --normalize --out {out}/compare
