dataset_path: /path/to/benchmarks/seed-bench
dataset_kwargs:
  verification_mode: no_checks
task: "seedbench_local"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.seed_doc_to_visual
doc_to_text: !function utils.seed_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.seed_process_result
metric_list:
  - metric: seed_image
    aggregation: !function utils.seed_aggregation_result
    higher_is_better: true
  - metric: seed_video
    aggregation: !function utils.seed_aggregation_result
    higher_is_better: true
  - metric: seed_all
    aggregation: !function utils.seed_aggregation_result
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  - version: 0.0
