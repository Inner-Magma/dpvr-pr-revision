dataset_path: parquet
dataset_kwargs:
  data_files:
    validation: /path/to/benchmarks/blink/blink_val_combined.parquet
  verification_mode: no_checks
task: "blink_local"
test_split: validation
output_type: generate_until
doc_to_visual: !function utils.blink_doc_to_visual
doc_to_text: !function utils.blink_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.blink_process_results
metric_list:
  - metric: accuracy
    aggregation: mean
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."
metadata:
  - version: 0.0
