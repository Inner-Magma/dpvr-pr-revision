dataset_path: /path/to/benchmarks/scienceqa/ScienceQA-IMG
task: "scienceqa_local"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.scienceqa_doc_to_visual
doc_to_text: !function utils.scienceqa_doc_to_text
doc_to_target: !function utils.scienceqa_doc_to_target
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.scienceqa_process_results
metric_list:
  - metric: mc_accuracy
    aggregation: mean
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."
metadata:
  - version: 0.0
