# Token-Diversion 13B: same method, larger backbone.
# Response to reviewer: verify the method scales beyond 7B.

defaults:
  - _base.yaml

model:
  base_model: llava-1.5-13b-hf
  llama_subdir: ~
  vision_tower_subdir: ~
  projector_subdir: ~

method:
  name: token_diversion
  split_layer: 18
  vision_depth: 1
  freeze_strategy: all_but_single

training:
  output_subdir: token_diversion_13b/llava665k_split18_d1
  # 13B + 1 trainable layer: bf16 + grad_checkpointing + batch=1 → ~38-42GB VRAM.
  # gradient_accumulation_steps=4 matches 7B effective batch size.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true
